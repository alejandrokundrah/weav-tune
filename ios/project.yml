# The iOS app's Xcode project, generated with XcodeGen (`xcodegen generate`
# in this folder) so no .xcodeproj is kept in git. CI does the same.
name: WeavTune
options:
  bundleIdPrefix: com.weavtune
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  WeavTuneCore:
    path: WeavTuneCore
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  WeavTune:
    type: application
    platform: iOS
    sources:
      - path: WeavTune
    dependencies:
      - package: WeavTuneCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weavtune.ios
        PRODUCT_NAME: WeavTune
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    info:
      path: WeavTune/Info.plist
      properties:
        CFBundleDisplayName: Weav-Tune
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
