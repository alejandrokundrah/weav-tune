# Builds the desktop app for Windows, macOS and Linux and attaches the installers to a GitHub
# release, next to the Android APKs. It follows each successful Release on main (that workflow
# publishes the release, and a release it makes sends no release event of its own), and can be run
# by hand for a release that's already out: Actions > Desktop release > Run workflow, with its tag.
#
# Each file is named for the release and the system it's for, e.g.
#   WeavTune-v1.0.4-windows-x64-setup.exe   WeavTune-v1.0.4-macos-arm64.dmg
#   WeavTune-v1.0.4-linux-x86_64.AppImage   WeavTune-v1.0.4-linux-amd64.deb
# Running again for the same tag replaces them.
name: Desktop release

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release to attach the desktop downloads to, e.g. v1.0.4
        required: true

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event.inputs.tag || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  # Which release, and the commit it was built from.
  release:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.find.outputs.tag }}
      ref: ${{ steps.find.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.inputs.tag }}
          fetch-depth: 0
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-v$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n 1)}"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            echo "::notice::No release $tag to attach desktop downloads to."
            exit 0
          fi
          # Release also runs on later pushes to main, skipping a version already out. Those don't
          # rebuild a release's desktop files; running this by hand does, and replaces them.
          if [ -z "$INPUT_TAG" ] && gh release view "$tag" --json assets -q '.assets[].name' | grep -q -- '-windows-x64-setup\.exe$'; then
            echo "::notice::$tag already has its desktop downloads."
            exit 0
          fi
          git fetch --tags --force --quiet
          # Built from the commit the release's tag points at, so the desktop app is that version's.
          ref="$(git rev-list -n 1 "$tag")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Desktop downloads for $tag from ${ref:0:7}"

  desktop:
    needs: release
    if: needs.release.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.ref }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build the player and the app
        working-directory: web
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @weavtune/app build
          pnpm --filter @weavtune/desktop bundle
      - name: Installers
        working-directory: web/desktop
        shell: bash
        run: |
          version="${TAG#v}"
          pnpm exec electron-builder ${{ matrix.args }} --publish never -c.extraMetadata.version="$version"
      - name: Collect the files for the release
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/desktop" && mkdir -p "$out"
          cd web/desktop/dist
          for f in WeavTune-*.exe WeavTune-*.dmg WeavTune-*.AppImage WeavTune-*.deb; do
            [ -e "$f" ] && cp "$f" "$out/"
          done
          ls -la "$out"
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/desktop/* --clobber --repo "${{ github.repository }}"
